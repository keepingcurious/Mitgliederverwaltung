name: Build Fanclub App

on:
  push:
    branches: [ "main", "master", "Mitgliederverwaltung" ]
  pull_request:
    branches: [ "main", "master", "Mitgliederverwaltung" ]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false   # ein fehlgeschlagenes OS bricht die anderen nicht ab
      matrix:
        # macos-15 statt macos-latest: Qt 6.8.2 linkt gegen das AGL-Framework,
        # das im SDK von macOS 26 (= macos-latest) nicht mehr existiert.
        # ubuntu-22.04: aeltere glibc -> das AppImage laeuft auf mehr Distributionen
        os: [ubuntu-22.04, windows-latest, macos-15]

    defaults:
      run:
        shell: bash      # einheitliche Syntax auf allen Plattformen

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten (für aqtinstall)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Qt installieren
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: ${{ runner.os == 'macOS' && 'mac' || (runner.os == 'Windows' && 'windows' || 'linux') }}
          target: 'desktop'
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || '' }}
          cache: true

      - name: Systembibliotheken für Qt installieren (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev

      # nlohmann/json wird NICHT mehr per Paketmanager installiert,
      # sondern in der CMakeLists.txt per FetchContent geladen (siehe Hinweis).

      - name: CMake Konfiguration
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Projekt bauen
        run: cmake --build build --config Release --parallel

      # --- Programme einsammeln (inkl. Qt-Bibliotheken unter Windows) ---
      - name: Paket zusammenstellen (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          cp build/Release/Fanclub.exe dist/
          windeployqt --release dist/Fanclub.exe

      - name: Paket zusammenstellen (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist packaging
          
          # Icon: eigene Datei packaging/fanclub.png wird bevorzugt,
          # sonst wird ein einfarbiger Platzhalter erzeugt.
          if [ -f assets/fanclub.png ]; then
            cp assets/fanclub.png packaging/fanclub.png
          else
            python3 - <<'PY'
          import struct, zlib
          w = h = 256
          raw = b"".join(b"\x00" + bytes([30, 90, 200]) * w for _ in range(h))
          def chunk(t, d):
              c = struct.pack(">I", len(d)) + t + d
              return c + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = (b"\x89PNG\r\n\x1a\n"
                 + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(raw))
                 + chunk(b"IEND", b""))
          open("packaging/fanclub.png", "wb").write(png)
          PY
          fi
          
          cat > packaging/fanclub.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Fanclub
          Exec=Fanclub
          Icon=fanclub
          Categories=Utility;
          Terminal=false
          EOF
          
          # linuxdeploy + Qt-Plugin laden (liegen im selben Ordner)
          cd packaging
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          
          # Auf den Runnern gibt es kein FUSE -> AppImages entpackt ausfuehren
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable ../build/Fanclub \
            --desktop-file fanclub.desktop \
            --icon-file fanclub.png \
            --plugin qt \
            --output appimage
          cd ..
          
          # Als tar.gz verpacken, damit das Ausfuehrrecht erhalten bleibt
          tar -czf dist/Fanclub-Linux-x86_64.tar.gz -C packaging Fanclub-x86_64.AppImage

      - name: Paket zusammenstellen (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ ! -d build/Fanclub.app ]; then
            echo "::error::Fanclub.app fehlt - in der CMakeLists.txt MACOSX_BUNDLE beim add_executable ergaenzen"
            exit 1
          fi
          mkdir dist
          cp -R build/Fanclub.app dist/
          macdeployqt dist/Fanclub.app
          # Ad-hoc-Signatur (Pflicht auf Apple Silicon, sonst startet die App nicht)
          codesign --force --deep --sign - dist/Fanclub.app
          # Als ZIP packen, damit Ausfuehrrechte erhalten bleiben
          ditto -c -k --keepParent dist/Fanclub.app Fanclub-macOS.zip
          rm -rf dist
          mkdir dist
          mv Fanclub-macOS.zip dist/

      - name: Artefakte (fertige Programme) hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Fanclub-${{ matrix.os }}
          path: dist/
          if-no-files-found: error